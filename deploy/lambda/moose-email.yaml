# Config bundled into the moose-email Lambda zip by `make lambda-email` (read via
# MOOSE_CONFIG=/var/task/moose.yaml). The table name comes from the environment
# Terraform sets: MOOSE_DYNAMO_TABLE, MOOSE_ENV.
env: prod
hostname: moose-email
store:
  kind: dynamo
  dynamo_table: ""           # MOOSE_DYNAMO_TABLE
email:
  provider: gmail
  providers: [google]        # microsoft is added here only once it is accepted (see microsoft.enabled)
  microsoft:
    # Stays false in prod until phase 7 (Graph drafts and send) lands and the phase 8
    # acceptance run is recorded. While false, connected Microsoft accounts are hidden from
    # tools (provider_disabled) with their credentials kept, and /connect/microsoft is not found.
    enabled: false
  calendar:
    # Stays false until the calendar acceptance run (docs/acceptance/calendar.md) shows every step
    # passed. While false the authorization server issues tokens for /email/mcp only and the connect
    # page has no Grant calendar button.
    enabled: false
  send:
    live: true               # every send still needs a passkey approval and the hourly cap
  # Set by Terraform in the Lambda environment, not here, because they are per tenant:
  #   MOOSE_EMAIL_BASE_URL            public origin; turns on /connect/google
  #   MOOSE_EMAIL_KMS_KEY_ID          symmetric key that seals refresh tokens
  #   MOOSE_GOOGLE_OAUTH_SECRET_ARN   Secrets Manager secret {client_id, client_secret}
  # The OAuth 2.1 server that puts /mcp behind a bearer token is required with a public origin:
  #   MOOSE_EMAIL_OWNER               the tenant owner tokens are issued to
  #   MOOSE_EMAIL_RP_ID               WebAuthn rp id every receipt must carry
  #   MOOSE_EMAIL_RECEIPT_PUBLIC_KEY  PEM public key of the approver's receipt signing key
  #   MOOSE_EMAIL_APPROVER_SECRET_ARN Secrets Manager HMAC key shared with moose-approver
  #   MOOSE_EMAIL_APPROVER_URL        optional; defaults to MOOSE_EMAIL_BASE_URL
