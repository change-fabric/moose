# Config bundled into the moose-calendar Lambda zip by `make lambda-calendar` (read via
# MOOSE_CONFIG=/var/task/moose.yaml). The table name and the public origin come from the
# environment Terraform sets: MOOSE_DYNAMO_TABLE, MOOSE_ENV, MOOSE_EMAIL_BASE_URL.
#
# moose-calendar shares the email: section with moose-email: the same account store (one
# DynamoDB table), the same public origin, the same provider switches. The OAuth server
# that issues its bearer tokens stays in moose-email; this server only verifies them, for
# the /calendar/mcp resource, so it needs the table and nothing else at this stage.
env: prod
hostname: moose-calendar
store:
  kind: dynamo
  dynamo_table: ""           # MOOSE_DYNAMO_TABLE
email:
  provider: gmail
  providers: [google]        # kept equal to moose-email's, so the same accounts are hidden or shown
  microsoft:
    enabled: false           # kept equal to moose-email's (see deploy/lambda/moose-email.yaml)
  calendar:
    # This server refuses to start while this is false. It is on here because this file is only
    # packaged into the calendar Lambda; the moose-email config keeps it off until the calendar
    # acceptance run (docs/acceptance/calendar.md) shows every step passed, which keeps the
    # calendar resource out of the authorization server and the Grant calendar button off the page.
    enabled: true
